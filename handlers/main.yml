---
- name: "netdata | Reload systemd daemons"
  ansible.builtin.systemd:
    daemon_reload: "yes"
  listen: "Daemon reload"
- name: "netdata | Restart netdata systemd service"
  ansible.builtin.systemd:
    name: "{{ hostvars[inventory_hostname]['netdata_service'] }}"
    state: "restarted"
  listen: "Restart netdata"
  when:
    - "hostvars[inventory_hostname]['netdata'] is defined"
    - "hostvars[inventory_hostname]['netdata'] not in ['', [], '[]', None]"
    - "hostvars[inventory_hostname]['netdata'] |
       community.general.json_query(lookup('ansible.builtin.vars',
      'netdata_restart', default='')) == 'true'"
  vars:
    netdata_restart: "[] | map(&restart || 'false', @) | [0]"
