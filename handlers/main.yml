---
- name: "netdata | Reload systemd daemons"
  ansible.builtin.systemd:
    daemon_reload: "yes"
  listen: "Daemon reload"
- name: "netdata | Restart netdata systemd service"
  ansible.builtin.systemd:
    name: "{{ lookup('ansible.builtin.vars', 'netdata_service') }}"
    state: "restarted"
  listen: "Restart netdata"
  when:
    - "lookup('ansible.builtin.vars', 'netdata', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'netdata') |
       community.general.json_query(lookup('ansible.builtin.vars',
      '_netdata_restart', default='')) == 'true'"
  vars:
    _netdata_restart: "[] | map(&restart || 'false', @) | [0]"
