---
- name: "netdata | Deploy conf.d/go.d/apcupsd.conf"
  ansible.builtin.template:
    src: "go.d/apcupsd.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'netdata_dest') +
      '/go.d/apcupsd.conf' }}"
    group: "root"
    owner: "root"
    mode: "0644"
    force: "yes"
  notify:
    - "Restart netdata"
