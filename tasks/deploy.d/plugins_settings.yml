---
- name: "netdata | Include python.d.conf tasks"
  ansible.builtin.include_tasks:
    file: "deploy.d/python.d_settings.yml"
  when:
    - "lookup('ansible.builtin.vars', '_netdata_plugins_settings_python',
      default='')['local'] is defined"
    - "lookup('ansible.builtin.vars', '_netdata_plugins_settings_python',
      default='')['local'] not in ['', [], '[]', None]"
- name: "netdata | Include go.d.conf tasks"
  ansible.builtin.include_tasks:
    file: "deploy.d/go.d_settings.yml"
  when:
    - "lookup('ansible.builtin.vars', '_netdata_plugins_settings_golang',
      default='')['local'] is defined"
    - "lookup('ansible.builtin.vars', '_netdata_plugins_settings_golang',
      default='')['local'] not in ['', [], '[]', None]"
- name: "netdata | Include go.d/prometheus.conf tasks"
  ansible.builtin.include_tasks:
    file: "deploy.d/go.d/prometheus.yml"
  vars:
    _netdata_plugins_settings_golang_prometheus_jobs:
      jobs: "{{ lookup('ansible.builtin.vars',
        '_netdata_plugins_settings_golang')['prometheus'] }}"
