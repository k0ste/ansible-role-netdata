---
- name: "netdata | Include pre requisite tasks"
  ansible.builtin.import_tasks:
    file: "pre_requisite.yml"
- name: "netdata | Include packages tasks"
  ansible.builtin.include_tasks:
    file: "packages.yml"
  when:
    - "lookup('ansible.builtin.vars', 'netdata', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'netdata') |
       community.general.json_query(lookup('ansible.builtin.vars',
      '_netdata_install_package', default='')) == 'true'"
  vars:
    _netdata_install_package: "[] | map(&install_package || 'false', @) | [0]"
- name: "netdata | Include exporting settings tasks"
  ansible.builtin.include_tasks:
    file: "deploy.d/exporting_settings.yml"
  when:
    - "lookup('ansible.builtin.vars', '_netdata_exporting_settings',
      default='') not in ['', [], '[]', None]"
- name: "netdata | Include plugins settings tasks"
  ansible.builtin.include_tasks:
    file: "deploy.d/plugins_settings.yml"
  when:
    - "lookup('ansible.builtin.vars', '_netdata_plugins_settings',
      default='') not in ['', [], '[]', None]"
- name: "netdata | Include netdata deployment tasks"
  ansible.builtin.import_tasks:
    file: "deploy.d/netdata.yml"
