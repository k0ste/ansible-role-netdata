---
- name: "netdata | Assert that ansible facts gathered successfully"
  ansible.builtin.assert:
    that:
      - "hostvars[inventory_hostname]['ansible_facts']['service_mgr'] is
        defined"
    fail_msg: "'ansible_facts' not found. Please enable facts gathering"
    quiet: "true"
- name: "netdata | Assert that system manager is systemd"
  ansible.builtin.assert:
    that:
      - "hostvars[inventory_hostname]['ansible_facts']['service_mgr'] ==
        'systemd'"
    fail_msg: "System manager is not systemd"
    quiet: "true"
- name: "netdata | Add the OS specific variables"
  ansible.builtin.include_vars:
    file: "{{ hostvars[inventory_hostname]['ansible_facts']['os_family'] +
      '.yml' }}"
- name: "netdata | Set facts about netdata role"
  ansible.builtin.set_fact:
    _netdata_systemd_dir: "{{ '/etc/systemd/system/' +
      lookup('ansible.builtin.vars', 'netdata_service') + '.service.d' }}"
    netdata_package_state: "{{ lookup('ansible.builtin.vars', 'netdata') |
      community.general.json_query('[].package_state | [0]') }}"
    _netdata_settings: "{{ lookup('ansible.builtin.vars', 'netdata') |
      community.general.json_query('[].settings[]') }}"
    _netdata_exporting_settings: "{{ lookup('ansible.builtin.vars', 'netdata') |
      community.general.json_query('[].settings[].exporting_settings[]') }}"
    _netdata_plugins_settings: "{{ lookup('ansible.builtin.vars', 'netdata') |
      community.general.json_query('[].settings[].plugins_settings[]') }}"
    _netdata_plugins_settings_python: "{{ lookup('ansible.builtin.vars',
      'netdata') |
      community.general.json_query('[].settings[].plugins_settings[].python[] |
      [0]') }}"
    _netdata_plugins_settings_golang: "{{ lookup('ansible.builtin.vars',
      'netdata') |
      community.general.json_query('[].settings[].plugins_settings[].golang[] |
      [0]') }}"
  when:
    - "lookup('ansible.builtin.vars', 'netdata', default='')
      not in ['', [], '[]', None]"
- name: "netdata | Assert that netdata package state in valid value"
  ansible.builtin.assert:
    that:
      - "lookup('ansible.builtin.vars', 'netdata_package_state') in
        ['present', 'latest']"
    fail_msg: "{{ 'package_state must be in `present` or `latest`,
      current is: ' + lookup('ansible.builtin.vars',
      'netdata_package_state') }}"
    quiet: "true"
  when:
    - "lookup('ansible.builtin.vars', 'netdata_package_state',
      default='') not in ['', [], '[]', None, 'present', 'latest']"
- name: "netdata | Set package state to 'present' cause value is not defined"
  ansible.builtin.set_fact:
    netdata_package_state: "present"
  when:
    - "lookup('ansible.builtin.vars', 'netdata_package_state',
      default='') in ['', [], '[]', None]"
- name: "netdata | Create netdata settings directory"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'netdata_dest') }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
  when:
    - "lookup('ansible.builtin.vars', '_netdata_settings',
      default='') not in ['', [], '[]', None]"
- name: "netdata | Create netdata plugins settings directory"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'netdata_dest') + '/' +
      _netdata_plugin_dir }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
  loop:
    - 'charts.d'
    - 'custom-plugins.d'
    - 'ebpf.d'
    - 'health.d'
    - 'go.d'
    - "python.d"
  loop_control:
    loop_var: "_netdata_plugin_dir"
    label: "{{ 'Create ' + lookup('ansible.builtin.vars', 'netdata_dest') +
      '/' + _netdata_plugin_dir }}"
  when:
    - "lookup('ansible.builtin.vars', '_netdata_plugins_settings',
      default='') not in ['', [], '[]', None]"
- name: "netdata | Create override systemd service directory"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', '_netdata_systemd_dir') }}"
    state: "directory"
    group: "root"
    owner: "root"
    mode: "0755"
    recurse: "no"
  when:
    - "lookup('ansible.builtin.vars', 'netdata', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'netdata') |
       community.general.json_query(lookup('ansible.builtin.vars',
      '_netdata_allow_sudo', default='')) == 'true'"
  vars:
    _netdata_allow_sudo: "[] | map(&allow_sudo || 'false', @) | [0]"
